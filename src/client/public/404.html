<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Budget Beaver</title>
    <!--
      GitHub Pages has no server-side rewrites, so a deep link (e.g. /BudgetBeaver/expenses)
      or a hard refresh on one hits this 404 page. Encode the real path into a query string and
      redirect to the app root, where the inline script in index.html decodes it back before
      React Router reads the URL. Standard technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep "/BudgetBeaver" from the path
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
